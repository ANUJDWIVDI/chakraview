<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #1f1f1f;
            color: white;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: #333;
            position: fixed;
            left: 0;
            top: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar h2 {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar li {
            margin: 20px 0;
            display: flex;
            align-items: center;
        }

        .sidebar li a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .sidebar li a:hover {
            color: #365dd6;
        }

        .sidebar li a .icon {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        /* Profile Section in Sidebar */
        .profile-section {
            background-color: #444;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .profile-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #365dd6;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            margin-bottom: 10px;
        }

        .profile-section h4 {
            color: white;
            margin: 0;
        }

        /* Event Section */
        .container {
            margin-left: 260px;
            padding-top: 30px;
            width: calc(100% - 260px);
        }

        .search-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-container input,
        .search-container select,
        .search-container button {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .search-container button {
            background-color: #365dd6;
            color: white;
            border: none;
        }

        .search-container button:hover {
            background-color: #274b9d;
        }

        .search-container h3 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Chat Box */
        .chat-box-container {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 350px;
            height: 50px;
            background-color: #365dd6;
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            cursor: pointer;
        }

        .chat-box-container .chat-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: white;
            color: #365dd6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-box-expanded {
            position: fixed;
            bottom: 70px;
            right: 20px;
            width: 350px;
            height: 400px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 10px;
            display: none;
            flex-direction: column;
        }

        .chat-box-expanded.active {
            display: flex;
        }

        .chat-box-expanded h4 {
            color: #365dd6;
            margin-bottom: 10px;
        }

        .chat-box-expanded .chat-box {
            flex: 1;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
            overflow-y: auto;
        }

        .chat-box-expanded .input-container {
            display: flex;
            gap: 10px;
        }

        .chat-box-expanded .input-container input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .chat-box-expanded .input-container button {
            padding: 10px 20px;
            background-color: #365dd6;
            color: white;
            border: none;
            border-radius: 5px;
        }

        /* Subscribe to Newsletter */
        .subscribe-section {
            margin-top: 20px;
            background-color: #444;
            padding: 15px;
            border-radius: 10px;
        }

        .subscribe-section input {
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            margin-bottom: 10px;
        }

        .subscribe-section button {
            padding: 10px 20px;
            background-color: #365dd6;
            color: white;
            border: none;
            border-radius: 5px;
            width: 100%;
        }

        .subscribe-section h3 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Chakraview</h2>

        <div class="profile-section">
            <div class="profile-icon">NS</div>
            <h4>NitiSense</h4>
            <p>{{name}}</p>
            <p>FCS: {{fcs}}</p>
        </div>

        <ul>
            <li><a href="#"><span class="icon">&#x1F4D6;</span> About</a></li>
            <li><a href= "{{url_for('alliance_load')}}" ><span class="icon">&#x1F91D;</span> Alliances</a></li>
            <li><a href="#"><span class="icon">&#x1F3AE;</span> Demo</a></li>
            <li><a href="#"><span class="icon">&#x1F4C4;</span> Data Policies</a></li>
            <li><a href="#"><span class="icon">&#x2709;</span> Contact</a></li>
        </ul>

        <div class="subscribe-section">
            <h3>Subscribe to Newsletter</h3>
            <input type="email" placeholder="Enter your email">
            <button>Subscribe</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <form action="/events" method="POST">
        <div class="search-container">
            <h3>Search for Events</h3>
            <input type="text" name="event-search" placeholder="Search for events...">
            <select name="city-select">
                <option value="">Select City</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Delhi">Delhi</option>
                <option value="Bangalore">Bangalore</option>
                <option value="Kolkata">Kolkata</option>
                <option value="Chennai">Chennai</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Pune">Pune</option>
                <option value="Ahmedabad">Ahmedabad</option>
                <option value="Chandigarh">Chandigarh</option>
                <option value="Jaipur">Jaipur</option>
            </select>
            <input type="hidden" name="name" value="{{name}}">
            <input type="hidden" name="user_id" value="{{user_id}}">
            <button type="submit">Search</button>
        </div>
        </form>
    </div>

    <!-- Chat Box -->
    <div class="chat-box-container" onclick="toggleChatBox()">
        <span>Chat with NitiSense</span>
        <div class="chat-icon">N</div>
    </div>

    <div class="chat-box-expanded" id="chat-box-expanded">
        <button onclick="toggleChatBox()" style="align-self: flex-end; background-color: #f44336; color: white;">X</button>
        <h4>NitiSense</h4>
        <div class="chat-box" id="chat-box"></div>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Ask something...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function toggleChatBox() {
            const chatBoxExpanded = document.getElementById('chat-box-expanded');
            chatBoxExpanded.classList.toggle('active');
        }

        function sendMessage() {
            const userInput = document.getElementById('user-input').value;
            if (userInput) {
                const chatBox = document.getElementById('chat-box');
                const message = document.createElement('div');
                message.classList.add('user-message');
                message.textContent = userInput;
                chatBox.appendChild(message);
                document.getElementById('user-input').value = '';
            }
        }
    </script>
</body>
</html>
