<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Intro</title>
    <style>
        /* Fullscreen style */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Video element to be played -->
    <video id="introVideo" autoplay>
        <source src="{{ url_for('static', filename='intro-vid.mp4') }}" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        // Get the video element
        const video = document.getElementById("introVideo");

        // Set a timeout to redirect after the video plays for 10.3 seconds
        video.onloadeddata = function() {
            setTimeout(function() {
                window.location.href = "{{ url_for('login') }}"; // Redirect to login page
            }, 10300); // 10.3 seconds (10,300 milliseconds)
        };
    </script>
</body>
</html>
