<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliances</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: white;
            color: black;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: #ef771b;
            position: fixed;
            left: 0;
            top: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar h2 {
            color: black;
            font-size: 1.5rem;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar li {
            margin: 20px 0;
            display: flex;
            align-items: center;
        }

        .sidebar li a {
            color: black;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .sidebar li a:hover {
            color: #ef771b;
        }

        .profile-section {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            border-color: #ef771b;
            margin-top: 20px;
        }

        .profile-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #ef771b;
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
            margin-bottom: 10px;
        }

        .profile-section h4 {
            color: black;
            margin: 0;
        }

        /* Main Content */
        .container {
            margin-left: 260px;
            padding-top: 20px;
            width: calc(100% - 260px);
        }

        .search-container {
            position: sticky;
            top: 0;
            background-color: black;
            padding: 15px 10px;
            z-index: 100;
            border-bottom: 1px solid #444;
        }

        .search-container input,
        .search-container button {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid black;
        }

        .search-container button {
            background-color: #ef771b;
            color: black;
            border: none;
        }

        .search-container button:hover {
            background-color: #ef771b;
        }

        .alliances-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
            padding: 10px;
            background-color: white;
            border-radius: 10px;
            border-color: #ef771b;;
        }

        .user {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background-color: #fff4e7;
            padding: 15px;
            border-radius: 10px;
            border-color: #ef771b;
            color: black;
        }

        .user h5 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .user p {
            margin: 5px 0;
        }

        .user button {
            background-color: #ef771b;
            color: black;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .user button:hover {
            background-color: #ef771b;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2><a href="{{url_for('dashboard')}}">  Chakraview </a> </h2>
        <div class="profile-section">
            <div class="profile-icon">NS</div>
            <h4>NitiSense</h4>
        </div>
        <ul>
            <li><a href="#"><span class="icon">&#x1F4D6;</span> About</a></li>
            <li><a href="#"><span class="icon">&#x1F465;</span> Team Members</a></li>
            <li><a href="#"><span class="icon">&#x1F3AE;</span> Demo</a></li>
            <li><a href="#"><span class="icon">&#x1F4C4;</span> Data Policies</a></li>
            <li><a href="#"><span class="icon">&#x2709;</span> Contact</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="search-container">
            <h3>Search for Users</h3>
            <input type="text" id="user-search" placeholder="Search for users...">
            <button onclick="searchUsers()">Search</button>
        </div>
        <div id="alliances-list" class="alliances-list"></div>
    </div>

    <script>
        function searchUsers() {
            const query = document.getElementById('user-search').value.trim();

            fetch(`/search-users?query=${query}`)
                .then(response => response.json())
                .then(data => {
                    const alliancesList = document.getElementById('alliances-list');
                    alliancesList.innerHTML = '';

                    if (data.users && data.users.length > 0) {
                        data.users.forEach(user => {
                            const userElement = document.createElement('div');
                            userElement.classList.add('user');
                            userElement.innerHTML = `
                                <h5>${user.name}</h5>
                                <p><strong>Bio:</strong> ${user.bio}</p>
                                <p><strong>Occupation:</strong> ${user.occupation}</p>
                                <button onclick="sendAllianceRequest('${user.id}')">Connect</button>
                            `;
                            alliancesList.appendChild(userElement);
                        });
                    } else {
                        alliancesList.innerHTML = '<p>No users found.</p>';
                    }
                })
                .catch(error => console.error('Error fetching users:', error));
        }

        function sendAllianceRequest(userId) {
            fetch(`/send-alliance?userId=${userId}`, { method: 'POST' })
                .then(response => response.json())
                .then(() => alert('Alliance request sent successfully!'))
                .catch(error => console.error('Error sending alliance request:', error));
        }

        window.onload = searchUsers;
    </script>
</body>
</html>
