<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Upload Document and Input Text</title>
        <script>
            function validateForm() {
                var fileInput = document.getElementById("file");
                var textInput = document.getElementById("additional_text");

                if (!fileInput.value && !textInput.value.trim()) {
                    alert("Please provide either a document or text content.");
                    return false;
                }
                return true;
            }
        </script>
    </head>
    <body>
        <h1>Upload a Document or Enter Text</h1>
        <form action="/upload" method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">
            <label for="file">Choose a PDF or Text File (optional):</label><br>
            <input type="file" name="file" id="file" accept=".pdf,.txt"><br><br>
            <label for="additional_text">Enter Additional Text (optional):</label><br>
            <textarea name="additional_text" id="additional_text" rows="4" cols="50" placeholder="Enter any additional information or content here..."></textarea><br><br>
            <input type="submit" value="Upload and Summarize">
        </form>
    </body>
    </html>
